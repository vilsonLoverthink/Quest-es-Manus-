<title>Bizus de Prova</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: coluna única de aplicativo, pensada para o celular. Início -> questão -> resultado, tudo na mesma página. */
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --ink:#16201A; --muted:#5B675F; --line:#D3DAD2;
  --accent:#2E5A4C; --accent-ink:#FFFFFF; --sel-bg:#E3ECE7;
  --ok:#1E7A3F; --ok-bg:#E1F1E5; --bad:#B3261E; --bad-bg:#F8E4E1; --hl:#FFE75A;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1A221E; --ink:#E8EEE9; --muted:#9AA79F; --line:#2E3933;
    --accent:#7FB8A3; --accent-ink:#0F1A15; --sel-bg:#223029;
    --ok:#6FCF8A; --ok-bg:#17301F; --bad:#F28B82; --bad-bg:#35201E; --hl:#6E5C00; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --ink:#E8EEE9; --muted:#9AA79F; --line:#2E3933;
  --accent:#7FB8A3; --accent-ink:#0F1A15; --sel-bg:#223029;
  --ok:#6FCF8A; --ok-bg:#17301F; --bad:#F28B82; --bad-bg:#35201E; --hl:#6E5C00; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:0 40px}
.wrap{max-width:680px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:1.65rem;letter-spacing:.04em;
  text-transform:uppercase;margin:0;line-height:1.1}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;min-height:120px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 150px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:600;padding:10px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:10px;align-items:center;font-size:.95rem}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:700;border-radius:6px;padding:13px 18px;cursor:pointer;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{width:auto;padding:9px 14px;font-size:.9rem}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{color:var(--bad);font-weight:600;min-height:1.2em;margin:0}
.muted{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}

/* desempenho */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1 1 90px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:3px}
.bar-l span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.track{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .g{background:var(--ok)}
.track .r{background:var(--bad)}

/* questão */
.meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.meta .cnt{font-family:var(--f-display);font-weight:600;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase}
.meta .tagd{font-size:.82rem;color:var(--muted)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent)}
.enun{font-size:1.15rem;line-height:1.45;font-weight:600;margin:0 0 16px;text-wrap:pretty}
ul.alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.alt:disabled{cursor:default;color:var(--ink)}
.alt .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--muted)}
.alt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.alt .mk{flex:none;width:22px;text-align:center;font-weight:700;font-size:1.2rem;line-height:1.3}
.alt .tag{display:block;margin-top:4px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.alt.sel{background:var(--sel-bg);border-color:var(--accent)}
.alt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.alt.ok{background:var(--ok-bg);border-color:var(--ok)}
.alt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.alt.ok .mk,.alt.ok .tag{color:var(--ok)}
.alt.bad{border-color:var(--line)}
.alt.bad.chosen{background:var(--bad-bg);border-color:var(--bad)}
.alt.bad .mk,.alt.bad .tag{color:var(--bad)}
.alt.bad.chosen .L{border-color:var(--bad);color:var(--bad)}
mark{background:var(--hl);color:var(--ink);padding:.02em .2em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
del{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--bad);text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent);background:transparent;padding:0 1px}
.why{margin:6px 0 0 4px;padding-left:12px;border-left:3px solid var(--bad);font-size:.92rem;color:var(--ink)}
.why b{color:var(--bad)}
.res{margin-top:18px;border-top:2px solid var(--ink);padding-top:12px}
.res h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:1.15rem;margin:0 0 6px}
.res p{margin:0 0 6px}
.res .base{font-size:.85rem;color:var(--muted)}
.res .base mark{font-weight:600}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 180px}

/* resultado */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.score b{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
details.rv{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:8px}
details.rv summary{cursor:pointer;padding:12px;display:flex;gap:10px;align-items:flex-start;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .st{flex:none;width:24px;font-weight:700;font-size:1.1rem;line-height:1.35}
details.rv .st.ok{color:var(--ok)} details.rv .st.bad{color:var(--bad)}
details.rv .sm{flex:1;min-width:0;font-size:.95rem}
details.rv .sm small{display:block;color:var(--muted)}
details.rv .body{padding:4px 12px 14px}
.adm summary{cursor:pointer;font-weight:600}
.adm .stack{margin-top:12px}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
</style>

</div>

<script>
/* ============ BANCO ============
   Vem dos arquivos em banco/, um por disciplina (veja as tags script acima). */
var AVISOS = [];
function valida(q){
  if(!q || !q.id || !q.disc || !q.enunciado) return 'faltam id, disc ou enunciado';
  if(!Array.isArray(q.alts) || q.alts.length < 2) return 'precisa de ao menos 2 alternativas';
  if(q.alts.some(function(a){return !a || !a.t})) return 'alternativa sem texto';
  var certas = q.alts.filter(function(a){return a.ok}).length;
  if(certas !== 1) return 'precisa de exatamente 1 alternativa certa';
  return '';
}
function montaBanco(partes){
  var vistos = {}, out = [];
  partes.forEach(function(q, i){
    var rot = (q && q.id) || ('#' + (i + 1)), why = valida(q);
    if(why){ AVISOS.push(rot + ' (' + why + ')'); return; }
    if(vistos[q.id]){ AVISOS.push(rot + ' (id repetido)'); return; }
    vistos[q.id] = 1; out.push(q);
  });
  return out;
}
var BANCO_BASE = montaBanco(window.BANCO_PARTES || []);

var MODELO = JSON.stringify([{
  id:'disc-001', disc:'Nome da disciplina', assunto:'Assunto do resumo',
  enunciado:'Texto da pergunta',
  alts:[
    {t:'Alternativa correta', ok:true},
    {t:'Alternativa errada com o trecho do erro dentro', erro:'trecho do erro', motivo:'Por que está errada'},
    {t:'Outra alternativa errada', erro:'trecho do erro', motivo:'Por que está errada'},
    {t:'Mais uma alternativa errada', erro:'trecho do erro', motivo:'Por que está errada'}
  ],
  resolucao:'Explicação da resposta certa, com ==a informação essencial== entre sinais de igual para sair em amarelo', base:'Resumo de onde saiu a questão'
}],null,2);

/* ============ ESTADO ============ */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var extra = load('sgt_extra',[]);
var stats = load('sgt_stats',{});
var prefs = load('sgt_prefs',{disc:'',n:'10',mode:'estudo',errou:false});
var S = null;           // sessão de treino
var homeMsg = '';
function banco(){return BANCO_BASE.concat(extra)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fonte(b){var i=b.indexOf(', ');return i<0?'<mark>'+esc(b)+'</mark>':esc(b.slice(0,i+2))+'<mark>'+esc(b.slice(i+2))+'</mark>'}
function hl(s){return esc(s).replace(/==([^=]+?)==/g,'<mark>$1</mark>')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function markErro(t,erro){
  var i = erro ? t.indexOf(erro) : -1;
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<del>'+esc(erro)+'</del>'+esc(t.slice(i+erro.length));
}
function pct(a,b){return b? Math.round(100*a/b):0}

/* ============ VISÕES ============ */
var app = document.getElementById('app');

function viewHome(){
  var B = banco();
  var discs = []; B.forEach(function(q){if(discs.indexOf(q.disc)<0)discs.push(q.disc)});
  var tot=0, okc=0, byDisc={};
  B.forEach(function(q){
    var s=stats[q.id]; if(!s) return;
    tot+=s.ok+s.err; okc+=s.ok;
    var d=byDisc[q.disc]||(byDisc[q.disc]={ok:0,err:0}); d.ok+=s.ok; d.err+=s.err;
  });
  var opts = '<option value="">Todas as disciplinas (simulado geral)</option>'+discs.map(function(d){
    var n=B.filter(function(q){return q.disc===d}).length;
    return '<option value="'+esc(d)+'"'+(prefs.disc===d?' selected':'')+'>'+esc(d)+' ('+n+')</option>';
  }).join('');
  var nOpts = ['5','10','20','todas'].map(function(n){
    return '<option value="'+n+'"'+(prefs.n===n?' selected':'')+'>'+(n==='todas'?'Todas as questões':n+' questões')+'</option>';
  }).join('');
  var bars = Object.keys(byDisc).map(function(d){
    var x=byDisc[d], t=x.ok+x.err;
    return '<div><div class="bar-l"><span>'+esc(d)+'</span><span>'+x.ok+'/'+t+' · '+pct(x.ok,t)+'%</span></div>'+
      '<div class="track"><i class="g" style="width:'+pct(x.ok,t)+'%"></i><i class="r" style="width:'+(100-pct(x.ok,t))+'%"></i></div></div>';
  }).join('');
  var perf = tot ?
    '<div class="kpis"><div class="kpi"><b>'+tot+'</b><span>respondidas</span></div><div class="kpi"><b>'+pct(okc,tot)+'%</b><span>de acerto</span></div><div class="kpi"><b>'+(tot-okc)+'</b><span>erros</span></div></div><div class="bars">'+bars+'</div>' :
    '<p class="muted" style="margin:0">Responda suas primeiras questões para ver o desempenho por disciplina aqui. Os dados ficam salvos neste aparelho.</p>';

  app.innerHTML =
    '<section class="panel stack"><h2>Novo treino</h2>'+
    '<label class="f">Disciplina<select id="f-disc">'+opts+'</select></label>'+
    '<div class="row"><label class="f">Quantidade<select id="f-n">'+nOpts+'</select></label>'+
    '<div class="f">Modo<div class="seg" role="group" aria-label="Modo">'+
      '<button type="button" data-mode="estudo" aria-pressed="'+(prefs.mode==='estudo')+'">Estudo</button>'+
      '<button type="button" data-mode="prova" aria-pressed="'+(prefs.mode==='prova')+'">Prova</button></div></div></div>'+
    '<p class="note" id="mode-note">'+(prefs.mode==='estudo'?'Estudo: a correção aparece logo após cada resposta.':'Prova: a correção completa aparece só no fim.')+'</p>'+
    '<label class="chk"><input type="checkbox" id="f-errou"'+(prefs.errou?' checked':'')+'> Só as que errei na última vez</label>'+
    '<p class="msg" id="msg" role="alert">'+esc(homeMsg)+'</p>'+
    '<button class="btn" id="go" type="button">Começar treino</button></section>'+
    '<section class="panel"><h2>Meu desempenho</h2>'+perf+'</section>'+
    '<section class="panel adm"><details><summary>Adicionar questões ('+B.length+' questões)</summary><div class="stack">'+
    '<p class="note">Cole aqui questões no formato abaixo para adicionar ao banco. A importação vale só neste aparelho. Para a turma toda, as questões entram nos arquivos do banco. Na resolução e no motivo, o que estiver entre == e == sai marcado em amarelo.</p>'+
    (AVISOS.length?'<p class="msg">Questões ignoradas no banco: '+esc(AVISOS.join(' · '))+'</p>':'')+
    '<textarea id="imp" placeholder="Cole o JSON das questões aqui" aria-label="JSON das questões"></textarea>'+
    '<p class="msg" id="imp-msg" role="status"></p>'+
    '<div class="row"><button class="btn small ghost" id="copy-model" type="button">Copiar formato</button><button class="btn small" id="do-import" type="button">Adicionar ao banco</button></div>'+
    (extra.length?'<button class="btn small ghost" id="clear-extra" type="button">Remover questões importadas ('+extra.length+')</button>':'')+
    (tot?'<button class="btn small ghost" id="clear-stats" type="button">Zerar meu desempenho</button>':'')+
    '</div></details></section>';
  homeMsg='';
}

function buildPool(){
  var B = banco();
  var p = B.filter(function(q){
    if(prefs.disc && q.disc!==prefs.disc) return false;
    if(prefs.errou){var s=stats[q.id]; if(!s||s.last!==false) return false}
    return true;
  });
  return p;
}
function startSession(pool,mode){
  var qs = shuffle(pool);
  if(prefs.n!=='todas' && !S_retry) qs = qs.slice(0,parseInt(prefs.n,10));
  S = {qs:qs.map(function(q){
        var c=Object.assign({},q); c.alts=shuffle(q.alts); return c;
      }), i:0, mode:mode, sel:null, rev:false, ans:[]};
  viewQuiz();
}
var S_retry=false;

function altsHTML(q,sel,rev){
  return q.alts.map(function(a,i){
    var L='ABCDE'.charAt(i), cls='alt', tag='', mark='', txt=esc(a.t), why='';
    var chosen = sel===i;
    if(!rev){ if(chosen) cls+=' sel'; }
    else if(a.ok){ cls+=' ok'; mark='✓'; tag = chosen?'Sua resposta · Gabarito':'Gabarito'; }
    else {
      cls+= chosen?' bad chosen':' bad'; mark='✕'; tag = chosen?'Sua resposta':''; txt=markErro(a.t,a.erro);
      if(a.motivo) why='<p class="why"><b>Por que está errada:</b> '+hl(a.motivo)+'</p>';
    }
    return '<li><button type="button" class="'+cls+'" data-alt="'+i+'"'+(rev?' disabled':'')+' aria-pressed="'+chosen+'">'+
      '<span class="L">'+L+'</span><span class="txt">'+txt+(tag?'<span class="tag">'+tag+'</span>':'')+'</span>'+
      '<span class="mk" aria-hidden="true">'+mark+'</span></button>'+why+'</li>';
  }).join('');
}
function resHTML(q){
  return '<section class="res"><h3>Resolução</h3><p>'+hl(q.resolucao||'')+'</p>'+(q.base?'<p class="base">Fonte: '+fonte(q.base)+'</p>':'')+'</section>';
}

function viewQuiz(){
  var q = S.qs[S.i], n=S.qs.length;
  var last = S.i===n-1;
  var btn;
  if(S.mode==='estudo' && !S.rev) btn='<button class="btn" id="confirm" type="button"'+(S.sel===null?' disabled':'')+'>Confirmar resposta</button>';
  else if(S.mode==='estudo') btn='<button class="btn" id="next" type="button">'+(last?'Ver resultado':'Próxima questão')+'</button>';
  else btn='<button class="btn" id="next" type="button"'+(S.sel===null?' disabled':'')+'>'+(last?'Finalizar prova':'Próxima questão')+'</button>';
  app.innerHTML =
    '<div class="meta"><span class="cnt">Questão '+(S.i+1)+' de '+n+'</span><span class="tagd">'+esc(q.disc)+(q.assunto?' · '+esc(q.assunto):'')+'</span></div>'+
    '<div class="prog" aria-hidden="true"><i style="width:'+Math.round(100*(S.i+(S.rev?1:0))/n)+'%"></i></div>'+
    '<p class="enun">'+esc(q.enunciado)+'</p>'+
    '<ul class="alts" id="alts">'+altsHTML(q,S.sel,S.rev)+'</ul>'+
    (S.rev?resHTML(q):'')+
    '<div class="actions">'+btn+'<button class="btn ghost" id="quit" type="button">Sair do treino</button></div>';
  window.scrollTo(0,0);
}

function record(){
  var q=S.qs[S.i], ok=!!q.alts[S.sel].ok;
  S.ans[S.i]={sel:S.sel,ok:ok};
  var s=stats[q.id]||(stats[q.id]={ok:0,err:0});
  if(ok)s.ok++; else s.err++;
  s.last=ok;
  save('sgt_stats',stats);
}

function viewResult(){
  var n=S.qs.length, ok=S.ans.filter(function(a){return a&&a.ok}).length;
  var erradas=S.qs.filter(function(q,i){return S.ans[i]&&!S.ans[i].ok});
  var list = S.qs.map(function(q,i){
    var a=S.ans[i];
    return '<details class="rv"><summary><span class="st '+(a.ok?'ok':'bad')+'" aria-label="'+(a.ok?'Acertou':'Errou')+'">'+(a.ok?'✓':'✕')+'</span>'+
      '<span class="sm">'+(i+1)+'. '+esc(q.enunciado)+'<small>'+esc(q.disc)+'</small></span></summary>'+
      '<div class="body"><ul class="alts">'+altsHTML(q,a.sel,true)+'</ul>'+resHTML(q)+'</div></details>';
  }).join('');
  app.innerHTML =
    '<section class="panel"><h2>Resultado</h2><div class="score"><b>'+pct(ok,n)+'%</b><span>'+ok+' de '+n+' certas</span></div>'+
    '<p class="muted" style="margin:0 0 14px">'+(erradas.length?'Abra cada questão abaixo para ver o gabarito, o trecho errado riscado e a resolução.':'Gabaritou. Nenhuma questão para revisar.')+'</p>'+
    '<div class="actions" style="margin-top:0">'+(erradas.length?'<button class="btn" id="retry" type="button">Refazer as '+erradas.length+' erradas</button>':'')+
    '<button class="btn ghost" id="home" type="button">Novo treino</button></div></section>'+
    '<h2>Revisão</h2>'+list;
  window.scrollTo(0,0);
}

/* ============ EVENTOS ============ */
app.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  var id=t.id;
  if(t.hasAttribute('data-mode')){
    prefs.mode=t.getAttribute('data-mode'); save('sgt_prefs',prefs);
    app.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});
    document.getElementById('mode-note').textContent = prefs.mode==='estudo'?'Estudo: a correção aparece logo após cada resposta.':'Prova: a correção completa aparece só no fim.';
    return;
  }
  if(id==='go'){
    prefs.disc=document.getElementById('f-disc').value;
    prefs.n=document.getElementById('f-n').value;
    prefs.errou=document.getElementById('f-errou').checked;
    save('sgt_prefs',prefs);
    var pool=buildPool();
    if(!pool.length){document.getElementById('msg').textContent = prefs.errou?'Nenhuma questão errada para refazer nesta seleção.':'Não há questões nesta seleção.';return}
    S_retry=false; startSession(pool,prefs.mode); return;
  }
  if(t.hasAttribute('data-alt') && S && !S.rev){
    S.sel=parseInt(t.getAttribute('data-alt'),10);
    app.querySelectorAll('.alt').forEach(function(b){
      var on=b===t; b.classList.toggle('sel',on); b.setAttribute('aria-pressed',String(on));
    });
    var c=document.getElementById('confirm')||document.getElementById('next'); if(c) c.disabled=false;
    return;
  }
  if(id==='confirm'){ if(S.sel===null) return; record(); S.rev=true; viewQuiz(); return; }
  if(id==='next'){
    if(S.mode==='prova' && !S.ans[S.i]){ if(S.sel===null) return; record(); }
    if(S.i>=S.qs.length-1){ viewResult(); return; }
    S.i++; S.sel=null; S.rev=false; viewQuiz(); return;
  }
  if(id==='quit'){ if(S.ans.some(Boolean)) viewResult(); else {S=null; viewHome()} return; }
  if(id==='home'){ S=null; viewHome(); return; }
  if(id==='retry'){
    var errs=S.qs.filter(function(q,i){return S.ans[i]&&!S.ans[i].ok});
    var mode=S.mode;
    var orig=errs.map(function(q){return banco().filter(function(b){return b.id===q.id})[0]||q});
    S_retry=true; startSession(orig,mode); return;
  }
  if(id==='copy-model'){
    var m=document.getElementById('imp-msg');
    var fallback=function(){var ta=document.getElementById('imp');ta.value=MODELO;ta.focus();ta.select();m.style.color='var(--muted)';m.textContent='Formato colocado na caixa. Copie o texto de lá.'};
    try{navigator.clipboard.writeText(MODELO).then(function(){m.style.color='var(--ok)';m.textContent='Formato copiado.'},fallback)}catch(err){fallback()}
    return;
  }
  if(id==='do-import'){ importar(); return; }
  if(id==='clear-extra'){ extra=[]; save('sgt_extra',extra); viewHome(); return; }
  if(id==='clear-stats'){ stats={}; save('sgt_stats',stats); viewHome(); return; }
});

function importar(){
  var m=document.getElementById('imp-msg'); m.style.color='var(--bad)';
  var raw=document.getElementById('imp').value.trim();
  if(!raw){m.textContent='Cole o JSON das questões primeiro.';return}
  var arr;
  try{arr=JSON.parse(raw)}catch(err){m.textContent='O texto não é um JSON válido. Confira vírgulas e aspas.';return}
  if(!Array.isArray(arr)) arr=[arr];
  var ids=banco().map(function(q){return q.id}), novas=[], pulou=0;
  for(var i=0;i<arr.length;i++){
    var q=arr[i], n=i+1;
    if(!q||!q.id||!q.disc||!q.enunciado||!Array.isArray(q.alts)||q.alts.length<2){m.textContent='Questão '+n+': faltam id, disc, enunciado ou alts (mínimo 2).';return}
    var certas=q.alts.filter(function(a){return a&&a.ok}).length;
    if(certas!==1){m.textContent='Questão '+n+': precisa ter exatamente 1 alternativa com "ok": true.';return}
    if(q.alts.some(function(a){return !a||!a.t})){m.textContent='Questão '+n+': toda alternativa precisa do texto em "t".';return}
    if(ids.indexOf(q.id)>=0){pulou++;continue}
    ids.push(q.id); novas.push(q);
  }
  extra=extra.concat(novas); save('sgt_extra',extra);
  homeMsg='';
  viewHome();
  var d=app.querySelector('.adm details'); if(d) d.open=true;
  var mm=document.getElementById('imp-msg'); mm.style.color='var(--ok)';
  mm.textContent=novas.length+' questão(ões) adicionada(s)'+(pulou?'. '+pulou+' ignorada(s) por repetir o id.':'.');
}

(function(){var B=banco(),d=[];B.forEach(function(q){if(d.indexOf(q.disc)<0)d.push(q.disc)});
  var s=document.getElementById('sub');if(s)s.textContent='Curso de Sargentos · '+B.length+' questões · '+d.length+(d.length===1?' disciplina':' disciplinas');})();
viewHome();
</script>
